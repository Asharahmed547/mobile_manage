name: Flutter CI/CD to Cloudflare Pages

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: DevOps Quality Gate - Static Analysis
        run: flutter analyze --no-fatal-infos

      - name: DevOps Quality Gate - Run Tests
        run: flutter test

      - name: Build Web Release (Injecting API Keys)
        run: |
          flutter build web --release \
            --dart-define=GEMINI_API_KEY="${{ secrets.GEMINI_API_KEY }}" \
            --dart-define=GROK_API_KEY="${{ secrets.GROK_API_KEY }}"

      - name: Deploy to Cloudflare Pages via Wrangler
        if: github.event_name != 'pull_request'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy build/web --project-name=first-choice-mobile --branch=main